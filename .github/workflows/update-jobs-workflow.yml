name: Job Radar – täglich aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 6 * * *' # Ersatzlauf, falls GitHub den ersten Zeitplan verzögert oder auslässt
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-jobs-workflow.yml'
      - '.github/workflows/job-radar-watchdog.yml'

permissions:
  contents: write

concurrency:
  group: job-radar-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Neue No-Key-Importer prüfen
        run: |
          node --check scripts/no-key-public-sources.mjs
          node --check scripts/himalayas-no-key.mjs
          node --check scripts/personio-no-key.mjs

      - name: Stellen aus allen Quellen aktualisieren
        run: |
          node scripts/update-jobs.mjs
          node scripts/arbeitsagentur-orte.mjs
          node scripts/supplement-sources.mjs
          node scripts/remote-jobs.mjs
          node scripts/extra-sources.mjs
          node scripts/local-employers.mjs
          node scripts/more-local-employers.mjs
          node scripts/falkensee-direct.mjs
          node scripts/small-local-office.mjs
          node scripts/small-local-office-fix.mjs
          node scripts/tegel-office-direct.mjs
          node scripts/fresh-local-office.mjs
          node scripts/extra-local-office-2.mjs
          node scripts/micro-local-office.mjs
          node scripts/major-job-portals.mjs
          node scripts/api-portale.mjs
          node scripts/expanded-15km-sources.mjs
          node scripts/no-key-public-sources.mjs
          node scripts/himalayas-no-key.mjs
          node scripts/personio-no-key.mjs
          node scripts/exclude-unwanted.mjs
          node scripts/office-profile.mjs
          node scripts/scope-jobs.mjs
          node scripts/validate-and-prefer-employer.mjs
          node scripts/update-ui-scope.mjs
          node scripts/track-new-jobs.mjs
          node scripts/apply-fresh-highlights.mjs
          node scripts/ensure-app-ui.mjs
        env:
          JOB_RADAR_RADIUS_KM: '15'
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Neue Jobdaten speichern
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add public data/geocode-cache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "chore: tägliche Stellen aktualisieren"
            git pull --rebase origin main
            git push
          fi
