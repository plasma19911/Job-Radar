name: Job Radar – GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen ob GitHub Pages aktiviert ist
        id: pagescheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages ist noch nicht aktiviert. Settings → Pages → Source: GitHub Actions."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pagescheck.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pagescheck.outputs.enabled == 'true'
        with:
          path: public

      - name: Veröffentlichen
        id: deployment
        if: steps.pagescheck.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
